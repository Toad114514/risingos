name: try to Build RisingOS Revived

on:
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses-dev \
            libreadline-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lz4 \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev
      - name: Set up git
        run: |
          git config --global user.email "build@risingos.dev"
          git config --global user.name "RisingOS Build Bot"
      - name: Manifest and Device tree
        run: |
          mkdir -p ~/bin
          echo "[Repo] Getting ./repo bin files"
          curl https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          echo "[Repo] Manifest generate"
          repo init -u https://github.com/Toad114514/risingos -b sixteen --git-lfs
          echo "[Manifest] Add Device Tree (Teamslow/device_oneplus_CPH2487)"
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/device.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <!-- Device Tree for OnePlus CPH2487 -->
            <project path="device/oneplus/CPH2487" name="Teamslow/device_oneplus_CPH2487" revision="13" />
            
            <!-- Kernel (if needed - uncomment and update with your kernel repo) -->
            <!-- <project path="kernel/oneplus/sm8350" name="your-kernel-repo" revision="main" /> -->
            
            <!-- Vendor (if needed - uncomment and update) -->
            <!-- <project path="vendor/oneplus/CPH2487" name="your-vendor-repo" revision="main" /> -->
          </manifest>
          EOF
      - name: Sync but it Will use many time
        run: |
          echo "[Repo] Start to Sync..."
          export PATH=~/bin:$PATH
          repo sync -c --no-clone-bundle --optimized-fetch --prune --force-sync -j4 || true
          
      - name: Setup
        run: |
          echo "[setup] ccache"
          ccache -M 50G
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          cd ~/risingos-build
          source build/envsetup.sh
          lunch rising_CPH2487-userdebug
          echo "[setup] Variabless"
          cd ~/risingos-build
          export RISING_MAINTAINER="toadXtech64"
          export WITH_GMS=true
          export TARGET_USES_PICO_GAPPS=true
          export BUILD_VARIANT=VANILLA
      - name: Build
        run: |
          cd ~/risingos-build
          source build/envsetup.sh
          export RISING_MAINTAINER="toadXtech64"
          export WITH_GMS=true
          export TARGET_USES_PICO_GAPPS=true
          export BUILD_VARIANT=VANILLA
          export USE_CCACHE=1
          lunch rising_CPH2487-userdebug
          if command -v riseup &> /dev/null; then
            riseup CPH2487 ${{ github.event.inputs.build_type || 'userdebug' }}
          else
            mka -j$(nproc --all) bacon
          fi
      - name: Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: risingos-CPH2487-${{ github.run_id }}
          path: |
            ~/risingos-build/out/target/product/CPH2487/*.zip
            ~/risingos-build/build_info.txt
          retention-days: 30
          if-no-files-found: warn
